name: Windows EXE bauen

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yavis-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 – testen und paketieren
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Projektstruktur prüfen
        shell: pwsh
        run: |
          $required = @('main.py', 'requirements.txt', 'yavis/ui.py', 'yavis/config.py', 'yavis/assistant.py', 'installer/yavis.iss', 'tools/make_icon.py')
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Pflichtdatei fehlt: $file. Bitte den INHALT der ZIP in das Repository hochladen, nicht nur die ZIP-Datei." }
          }
          if (!(Test-Path 'yavis/__init__.py')) { Set-Content -Path 'yavis/__init__.py' -Value '__version__ = "1.0.0"' }

      - name: Build-Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Abhängigkeiten prüfen
        run: python -m pip check

      - name: Tests – Kernfunktionen
        run: python tests/test_core.py

      - name: Tests – Mining-Berechnung
        run: python test_mining.py

      - name: Tests – Bitcoin-Wallet (mocked, ohne Netzwerk/Schlüssel)
        run: python tests/test_wallet.py

      - name: App-Icon erzeugen
        run: python tools/make_icon.py

      - name: Windows-App mit PyInstaller bauen
        shell: pwsh
        run: |
          pyinstaller main.py --name YAVIS --onedir --noconsole --noconfirm --clean --icon assets/yavis.ico `
            --paths . --collect-submodules yavis `
            --hidden-import yavis.ui --hidden-import yavis.assistant --hidden-import yavis.skills `
            --hidden-import yavis.voices --hidden-import yavis.stt --hidden-import yavis.brain `
            --hidden-import yavis.music --hidden-import yavis.memory --hidden-import yavis.programs `
            --hidden-import yavis.config --hidden-import yavis.wake --hidden-import yavis.mci --hidden-import yavis.mining --hidden-import yavis.wallet `
            --hidden-import winreg --hidden-import sqlite3 --hidden-import difflib --hidden-import webbrowser `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all onnxruntime `
            --collect-all sounddevice --collect-all _sounddevice_data --collect-all edge_tts `
            --collect-all pyttsx3 --collect-all ddgs --collect-all primp `
            --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 `
            --hidden-import win32com --hidden-import comtypes --hidden-import pyperclip
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller-Build ist fehlgeschlagen.' }
          if (!(Test-Path 'dist/YAVIS/YAVIS.exe')) { throw 'YAVIS.exe wurde nicht erstellt.' }

      - name: Selbsttest der fertigen EXE
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath (Resolve-Path 'dist/YAVIS/YAVIS.exe') -ArgumentList '--selftest' -Wait -PassThru
          if (!(Test-Path 'dist/YAVIS/selftest.txt')) { throw "EXE-Selbsttest hat keine Ergebnisdatei erstellt (Exitcode $($p.ExitCode))." }
          Get-Content 'dist/YAVIS/selftest.txt'
          if ($p.ExitCode -ne 0) { throw "EXE-Selbsttest fehlgeschlagen (Exitcode $($p.ExitCode))." }
          if ((Get-Content 'dist/YAVIS/selftest.txt' -Raw) -notmatch 'ERGEBNIS: BESTANDEN') { throw 'Selbsttest meldet keinen Erfolg.' }

      - name: Portables Paket erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/YAVIS/*' -DestinationPath 'dist/YAVIS-Portable-Windows.zip' -CompressionLevel Optimal
          if (!(Test-Path 'dist/YAVIS-Portable-Windows.zip')) { throw 'Portable ZIP wurde nicht erstellt.' }

      - name: Inno Setup installieren
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup konnte nicht installiert werden.' }

      - name: Windows-Installer erstellen
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw "ISCC.exe nicht gefunden: $iscc" }
          & $iscc 'installer/yavis.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup konnte den Installer nicht erstellen.' }
          if (!(Test-Path 'installer/Output/YAVIS-Setup.exe')) { throw 'YAVIS-Setup.exe fehlt.' }

      - name: Installer als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: YAVIS-Setup-Windows
          path: installer/Output/YAVIS-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Portable ZIP als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: YAVIS-Portable-Windows
          path: dist/YAVIS-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Release-Dateien veröffentlichen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/Output/YAVIS-Setup.exe
            dist/YAVIS-Portable-Windows.zip
